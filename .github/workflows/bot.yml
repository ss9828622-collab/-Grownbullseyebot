name: Telegram market bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes at busy times)
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual test: leave empty for a normal run, or news / calendar / quiz / poll"
        required: false
        default: ""

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py ${{ github.event.inputs.mode }}
      - name: Save state (so nothing is posted twice)
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "bot state" -q && git push -q)
