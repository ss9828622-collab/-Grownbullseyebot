name: Telegram market bot

# How it stays on: a "loop" run checks every 10 minutes for ~5h40m, then starts the next loop run
# itself. The cron below is only a backup that restarts the loop if the chain ever stops.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Leave as 'loop' to run continuously, or test one thing: news / calendar / quiz / poll / promo-full / promo-value / promo-short"
        required: false
        default: "loop"

concurrency:
  group: telegram-bot-${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'loop' || github.event.inputs.mode == '') && 'loop' || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'loop' || github.event.inputs.mode || 'loop' }}
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          save_state() {
            git add state.json
            git diff --cached --quiet || { git commit -q -m "bot state" && { git push -q || { git pull -q --rebase -X ours && git push -q; }; }; }
          }
          if [ "$MODE" != "loop" ]; then
            python bot.py "$MODE"; save_state; exit 0
          fi
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase -X theirs || true
            python bot.py || echo "run failed, continuing"
            save_state || echo "state save failed, continuing"
            sleep 600
          done
      - name: Start the next loop run
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'loop' || github.event.inputs.mode == '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -f mode=loop -R ${{ github.repository }}
